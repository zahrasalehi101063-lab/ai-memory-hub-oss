[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-hub-oss"
version = "0.1.0"
description = "A local-first, project-scoped memory toolkit for AI workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Zahra Salehi Shahrebabaki"}]

[tool.setuptools.packages.find]
where = ["src"]
